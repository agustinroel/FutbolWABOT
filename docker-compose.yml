services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/montemar.sqlite
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      DASHBOARD_API_HOST: 0.0.0.0
      DASHBOARD_API_PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - montemar-data:/app/data
      - montemar-session:/app/.wwebjs_auth
      - montemar-cache:/app/.wwebjs_cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  montemar-data:
  montemar-session:
  montemar-cache:
